name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # riprap's own guardrails have to hold for riprap. If the hooks it ships are
  # broken, everything downstream inherits that.
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These two steps run riprap's own stack seams rather than restating what
      # they do. That is the contract riprap ships — "hooks and CI both call this,
      # so there is exactly one definition and the two cannot drift" — and it was
      # not true of riprap itself: CI and CLAUDE.md held separate copies of the
      # scrub path list, and they had already come to disagree.
      #
      # bin/lint  = shellcheck over every script + bin/scrub-check over everything
      #             published, including .claude/.
      # bin/test  = the hook tests, bin/build-manifest --check, and the licence
      #             copies with the Required Notice line the licence obliges.
      - name: Lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          bin/lint

      - name: Test
        run: bin/test

      # The plugin ships prose and skills; every executable is in the payload,
      # where the project can read it. One find keeps that true.
      - name: Prose and scripts stay apart
        run: |
          found=$(find plugin/instructions plugin/skills -type f ! -name '*.md')
          if [ -n "$found" ]; then echo "non-markdown in plugin prose:"; echo "$found"; exit 1; fi

      - name: Plugin metadata is valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json \
                   plugin/hooks/hooks.json plugin/permissions.suggested.json; do
            jq -e . "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
          # Only plugin.json is consumed — install-payload stamps VERSION from it. A
          # marketplace file advertising a different number is a listing that promises a
          # version nobody can install.
          m=$(jq -r .metadata.version .claude-plugin/marketplace.json)
          p=$(jq -r .version plugin/.claude-plugin/plugin.json)
          [ "$m" = "$p" ] || { echo "❌ marketplace says $m, plugin says $p"; exit 1; }
          echo "✅ plugin metadata valid, versions agree"

      # The site and the README describe the same thing at two lengths, and prose is
      # allowed to differ. Counts, commands and URLs are not: every check below is one
      # that has already gone wrong here, or protects a URL something else prints.
      - name: The site and the README agree with the repository
        run: |
          fail=0

          # Spelled-out counts rot silently — no digit for the count regexes to catch.
          # Only the numbers riprap could plausibly reach are mapped; an unmapped count
          # fails loudly rather than skipping the check. Defined up here because both
          # the skill count and the rule counts need it.
          word_for() {
            case "$1" in
              3) echo three ;; 4) echo four ;; 5) echo five ;; 6) echo six ;;
              7) echo seven ;; 8) echo eight ;; 9) echo nine ;; 10) echo ten ;;
              *) echo "UNMAPPED-$1" ;;
            esac
          }

          # 1. The catalogue cannot rot, in either direction. A sixteenth document that
          #    the site never mentions is invisible: nothing looks broken.
          for f in plugin/instructions/*.md; do
            n=$(basename "$f")
            [ "$n" = "README.md" ] && continue
            grep -q "$n" docs/reference.md || {
              echo "❌ $n ships but docs/reference.md does not list it"; fail=1; }
          done
          grep -oE '`?[a-z-]+\.md`?' docs/reference.md | tr -d '`' | sort -u |
          while IFS= read -r n; do
            case "$n" in index.md|install.md|guardrails.md|rules.md|reference.md|license.md) continue ;; esac
            [ -f "plugin/instructions/$n" ] || {
              echo "❌ docs/reference.md lists $n, which is not shipped"; exit 1; }
          done || fail=1

          # 1b. And the router links every document it ships. docs/reference.md is the
          #     human catalogue; the router is what the *model* is given, so a document
          #     missing from it is a document the model is never routed to — shipped,
          #     catalogued, and unreachable. That is the founding unwired-hook incident
          #     with prose in place of a hook, and it fails the same way: nothing looks
          #     broken.
          for f in plugin/instructions/*.md; do
            n=$(basename "$f")
            [ "$n" = "README.md" ] && continue
            grep -q "($n)" plugin/instructions/README.md || {
              echo "❌ $n ships but the router never links it"; fail=1; }
          done

          # 2. Counts cannot contradict the filesystem. This drifted twice before the site
          #    existed: 15 versus 16 documents, and an assertion count off by nine.
          #    "guardrail document" is the reserved phrase for what riprap ships, which is
          #    why it is the one matched — "instruction document" describes the private
          #    codebase riprap was distilled from and carries a different, larger number.
          n=$(find plugin/instructions -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          bad=$(grep -rnoiE '[0-9]+ guardrail document' README.md docs/ \
                  | grep -vE "[^0-9]$n guardrail document" || true)
          [ -z "$bad" ] || { echo "❌ document count is not $n:"; echo "$bad"; fail=1; }

          #    The skill count is the same shape, with one difference that cost a release
          #    note: the phrase is hard-wrapped mid-sentence in two places — "19 guardrail
          #    documents, four\nskills" — and a line-oriented grep cannot see across the
          #    break. index.md ended up saying four in one paragraph and five in two
          #    others, on the same page, with every check green. So the file is flattened
          #    before matching. The count is read from the filesystem rather than hard-
          #    coded, so adding a skill fails here naming the files, not on a bare number.
          s=$(find plugin/skills -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          sw=$(word_for "$s")
          #    Matched on the claim rather than on the word, because "N skills" appears in
          #    prose that claims nothing about what riprap ships: the provenance figures
          #    for the private codebase ("20 skills, and 16 agent roles"), a note about
          #    two skills colliding in an adopter's repository, another tool's count. A
          #    check that fires on those blocks an unrelated docs change and reports a
          #    count its author never wrote, which is how a check gets deleted. So the
          #    window has to look like the real claim: next to "guardrail document", next
          #    to "loaded every session", or written as "the N skills".
          for f in README.md CLAUDE.md docs/_config.yml .claude-plugin/marketplace.json \
                   plugin/commands/install.md plugin/instructions/README.md \
                   $(find docs -name '*.md'); do
            [ -f "$f" ] || { echo "❌ skill-count sweep: $f is missing"; fail=1; continue; }
            #    Matched on the claim, not on the word. "N skills" appears in prose that
            #    is not a claim about what riprap ships — the provenance figures for the
            #    private codebase ("20 skills, and 16 agent roles"), a note about two
            #    skills colliding, another tool's skill count — and a check that fires on
            #    those blocks an unrelated docs change with a message about a count the
            #    author never wrote. So it requires "riprap" or "guardrail document" in
            #    the same window: the shapes the real claim actually takes.
            #
            #    A window is also allowed to contain the right count somewhere, which is
            #    what makes "it had four skills, now five" writable. That costs the check
            #    a sentence naming both counts wrongly, and buys back every sentence that
            #    legitimately names two.
            bad=$(tr '\n' ' ' <"$f" | tr -s ' ' \
                    | grep -oiE "[^.]{0,60}\b(one|two|three|four|five|six|seven|eight|nine|ten|[0-9]+) +skills?\b[^.]{0,40}" \
                    | grep -iE "guardrail document|loaded every session|\bthe +[a-z0-9]+ +skills?\b" \
                    | grep -viE "\b($sw|$s) +skills?\b" || true)
            [ -z "$bad" ] || { echo "❌ $f: skill count is not $sw:"; echo "$bad"; fail=1; }
          done

          #    And the enumerations beside the counts. A count that moves while the list
          #    next to it does not is the same rot in a shape no count check can see:
          #    five promised, four named. Every document that names any skill names all.
          #
          #    CLAUDE.md is in this list because riprap uses the skills it ships, and
          #    the way that stops being true is not a deletion — it is someone writing
          #    the procedure out again beside the skill that already covers it. Naming
          #    every skill is the part of that a check can see. Note what it does NOT
          #    prove: a CLAUDE.md that names all of them and still restates a whole
          #    procedure passes this. No check can prove prose has stopped forking one.
          for f in README.md CLAUDE.md docs/index.md docs/install.md docs/reference.md docs/rules.md; do
            for d in plugin/skills/*/; do
              k=$(basename "$d")
              grep -qF "/riprap:$k" "$f" || { echo "❌ $f never names /riprap:$k"; fail=1; }
            done
            #    And the other direction, which is the half a one-way check misses: a
            #    skill that was renamed or retired leaves its old name in every one of
            #    these documents, every count still agrees, and CI stays green. Same rot
            #    as "five promised, four named", pointing the reader at an invocation
            #    that no longer exists.
            for m in $(grep -oE '/riprap:[a-z][a-z0-9-]*' "$f" | sort -u); do
              n="${m#/riprap:}"
              [ "$n" = "install" ] && continue   # a command, not a skill
              [ -d "plugin/skills/$n" ] || { echo "❌ $f names $m, which ships no skill"; fail=1; }
            done
          done

          # 3. One install command form. Both work, but two documented forms is how the
          #    README and the site started disagreeing in the first place.
          bad=$(grep -rn '/plugin install riprap' README.md docs/ | grep -v 'riprap@influpert' || true)
          [ -z "$bad" ] || { echo "❌ unqualified install command:"; echo "$bad"; fail=1; }

          # 4. Internal links resolve. jekyll-relative-links rewrites these at build
          #    time, so a typo is a 404 that only shows up in production.
          grep -rhoE '\]\([a-z-]+\.md' docs/*.md | sed 's/^](//' | sort -u |
          while IFS= read -r t; do
            [ -f "docs/$t" ] || { echo "❌ docs links to $t, which does not exist"; exit 1; }
          done || fail=1

          # 4b. And so do the fragments. A link to a heading that was renamed lands the
          #     reader at the top of the right page with no error, which is why it survives
          #     review — it looks like it worked. Slugs are kramdown's: lowercased,
          #     punctuation dropped, spaces hyphenated.
          grep -rhoE '\]\([a-z-]+\.md#[a-z0-9-]+\)' docs/*.md | sed 's/^](//;s/)$//' | sort -u |
          while IFS= read -r ref; do
            f="docs/${ref%%#*}"; frag="${ref##*#}"
            grep -oE '^#{2,3} .*' "$f" \
              | sed -e 's/^#* //' -e 's/[^A-Za-z0-9 -]//g' -e 's/ /-/g' \
              | tr '[:upper:]' '[:lower:]' | grep -qx "$frag" || {
                echo "❌ $ref points at a heading that does not exist"; exit 1; }
          done || fail=1

          # 5. https://riprap.dev/#license is a published URL, and installer copies already
          #    in plugin caches print it into the terminal. Renaming that heading — or
          #    spelling it "Licence" — silently breaks it.
          grep -qx '## License' docs/index.md || {
            echo "❌ docs/index.md lost its '## License' heading; riprap.dev/#license breaks"; fail=1; }

          # 6. If CNAME leaves the default branch, GitHub clears the custom domain.
          [ -s docs/CNAME ] || { echo "❌ docs/CNAME is missing or empty"; fail=1; }

          # 7. The behavioural rules are stated in four documents and nothing bound them
          #    together: the router, docs/rules.md's numbered list, and a table copied
          #    verbatim into both README.md and docs/index.md. That is the same shape
          #    as the document count in check 2, which drifted twice — except worse,
          #    because a rule that reads differently in two places is not a formatting
          #    slip, it is two different rules, and the reader has no way to tell which
          #    one the model was given.
          rules_table() {  # $1 = file — the behavioural-rules table, header row onward
            sed -n '/^| Rule | What it does |$/,/^$/p' "$1"
          }

          # Assert the extraction found a table at all, BEFORE comparing. Two empty
          # extractions compare equal, so renaming the header in both files would sail
          # through the diff below — the exact false-pass this check exists to avoid.
          for f in README.md docs/index.md; do
            [ -n "$(rules_table "$f")" ] || {
              echo "❌ no behavioural-rules table found in $f — was the header row renamed?"
              echo "   The check greps for a line reading exactly '| Rule | What it does |'."
              fail=1; }
          done

          if ! diff -q <(rules_table README.md) <(rules_table docs/index.md) > /dev/null; then
            echo "❌ the behavioural-rules table differs between README.md and docs/index.md:"
            diff <(rules_table README.md) <(rules_table docs/index.md) || true
            fail=1
          fi

          # The router is the source of truth: it is what the model is actually given.
          # Everything else describes it, so everything else counts the same.
          #
          # Every count below carries `|| true`. `grep -c` prints 0 and EXITS 1 when it
          # matches nothing, which under this step's `set -e` kills the job mid-check with
          # no output whatsoever — a red build nobody can diagnose. With `|| true` the zero
          # reaches the comparison and fails with a sentence instead.
          b=$(grep -cE '^\*\*[0-9]+\. ' plugin/instructions/README.md || true)
          for f in README.md docs/index.md; do
            t=$(rules_table "$f" | grep -c '^| \*\*' || true)
            [ "$t" -eq "$b" ] || {
              echo "❌ $f lists $t behavioural rules; the router has $b"; fail=1; }
          done
          r=$(sed -n '/^## The [a-z]* behavioural rules$/,/^## /p' docs/rules.md \
                | grep -cE '^\*\*[0-9]+\. ' || true)
          [ "$r" -eq "$b" ] || {
            echo "❌ docs/rules.md lists $r behavioural rules; the router has $b"; fail=1; }

          # And the critical rules, counted by the link every one of them carries.
          c=$(sed -n '/^## Critical rules$/,/^## /p' plugin/instructions/README.md \
                | grep -c '^→ \|→ \[' || true)
          d=$(sed -n '/^## The [a-z]* that cost the most when forgotten$/,/^## /p' docs/rules.md \
                | grep -cE '^\*\*[A-Z]' || true)
          [ "$c" -eq "$d" ] || {
            echo "❌ docs/rules.md restates $d critical rules; the router has $c"; fail=1; }

          bw=$(word_for "$b"); cw=$(word_for "$c")
          # The router states its own critical-rule count in prose, and that was the one
          # spelled-out number this check did not bind — while CLAUDE.md claimed all four
          # sites move together. Binding it makes the claim true rather than aspirational.
          grep -qx "These $cw are restated in full rather than linked: they cost the most when forgotten." \
            plugin/instructions/README.md || {
            echo "❌ the router does not say 'These $cw are restated in full'"; fail=1; }
          grep -qx "## The $bw behavioural rules" docs/rules.md || {
            echo "❌ docs/rules.md's heading does not say '$bw behavioural rules'"; fail=1; }
          grep -qx "## The $cw that cost the most when forgotten" docs/rules.md || {
            echo "❌ docs/rules.md's heading does not say '$cw that cost the most'"; fail=1; }
          grep -q "$bw behavioural rules and $cw critical rules" docs/rules.md || {
            echo "❌ docs/rules.md's front matter does not say '$bw behavioural rules and $cw critical rules'"; fail=1; }
          # The sentence under the table that enumerates the critical rules, at both sites.
          # `rules_table()` stops at the blank line after the table, so everything below it
          # was unbound — which left the sentence free to state a different number from the
          # router, to list a different set of rules from the other site, or to promise six
          # and enumerate five. All three pass a check that only greps for the numeral.
          #
          # Read with newlines flattened, because the paragraph is hard-wrapped and adding a
          # rule is exactly what reflows it. A check that fails on a rewrap fails hardest at
          # the moment it is meant to be useful.
          flattened() { tr '\n' ' ' < "$1" | sed 's/  */ /g'; }
          critical_clauses() {  # $1 = file — the listed rules, one per line
            flattened "$1" \
              | grep -oE 'restated in full because they cost the most when forgotten:[^.]*\.' \
              | head -1 | sed 's/^[^:]*: //' | tr ';' '\n' | sed 's/^ *//;s/ *$//'
          }
          # Assert both extractions found a sentence BEFORE comparing them, for the same
          # reason the table check asserts it above: two empty extractions compare equal.
          for f in README.md docs/index.md; do
            [ -n "$(critical_clauses "$f")" ] || {
              echo "❌ no critical-rule summary sentence found in $f"
              echo "   The check looks for '…restated in full because they cost the most"
              echo "   when forgotten: <rule>; <rule>; …' ending in a full stop."
              fail=1; }
          done
          if ! diff -q <(critical_clauses README.md) <(critical_clauses docs/index.md) > /dev/null; then
            echo "❌ the critical rules listed under the table differ between README.md and docs/index.md:"
            diff <(critical_clauses README.md) <(critical_clauses docs/index.md) || true
            fail=1
          fi
          sc=$(critical_clauses README.md | grep -c . || true)
          [ "$sc" -eq "$c" ] || {
            echo "❌ the summary sentence enumerates $sc critical rules; the router has $c"; fail=1; }
          # And the spelled-out number introducing it. Matched case-insensitively because
          # word_for emits lowercase and docs/index.md opens a sentence with it.
          flattened README.md | grep -qi "Plus $cw restated in full" || {
            echo "❌ README.md does not introduce the list with 'Plus $cw restated in full'"; fail=1; }
          flattened docs/index.md | grep -qi "$cw more are restated in full" || {
            echo "❌ docs/index.md does not introduce the list with '$cw more are restated in full'"; fail=1; }

          # 8. A CODEOWNERS rule that matches no tracked file is a review gate that
          #    looks configured and requests nobody. That is the same shape as the
          #    unregistered hook in the step below, and it had already happened here:
          #    /bin/hooks/** was written for the layout riprap installs INTO, while
          #    riprap's own machinery lives under plugin/ — so every guardrail script
          #    it ships could be changed without an owner review.
          #
          #    There is NO exemption list. The first version of this check had one,
          #    and it contained /bin/hooks/ — the exact rule that was broken — so it
          #    passed against the very file it was written to reject. An exemption
          #    shaped around the bug is not an exemption, it is a blindfold. Rules
          #    for paths this repository does not have are simply not kept.
          #
          #    Only PATH rules are checked. The keyword globs (**/*auth*,
          #    **/*payment*) carry no slash, match on filename anywhere, and are
          #    meant to match nothing until the day such a file appears.
          #
          #    `:(glob)` is load-bearing. Git's DEFAULT pathspec lets `*` cross a
          #    slash; gitignore and CODEOWNERS do not. Without it a rule like
          #    /plugin/payload/bin/hooks/*.sh — which owns nothing at all — matches
          #    14 files here and passes, so tightening a rule to own less would look
          #    like tightening it to own something.
          while read -r pat owner || [ -n "$pat" ]; do   # `||` so a file with no
            case "$pat" in ''|'#'*) continue ;; esac      # trailing newline still
            case "$pat" in '**/'*) continue ;; esac       # yields its last rule
            # A pattern carrying a slash anywhere is root-anchored under gitignore
            # rules, so `plugin/ghost/**` is as live on GitHub as `/plugin/ghost/**`
            # and has to be checked too. The `**/`-leading keyword globs above are
            # the only ones meant to match nothing.
            case "$pat" in */*) ;; *) continue ;; esac
            case "$owner" in @*) ;; *)
              echo "❌ CODEOWNERS rule '$pat' names no owner — it REMOVES ownership"
              echo "   from that path, because the last matching rule wins."
              fail=1; continue ;;
            esac
            probe="${pat#/}"
            [ -n "$(git ls-files -- ":(glob)$probe" | head -1)" ] || {
              echo "❌ CODEOWNERS rule '$pat' matches no tracked file"; fail=1; }
          done < .github/CODEOWNERS

          [ "$fail" -eq 0 ] && echo "✅ site, README and repository agree"
          exit "$fail"

      # The founding incident: a hook was written, reviewed, merged — and never
      # referenced from any settings file. It looked enforced for months and was
      # not. That check belongs here, upstream, where both halves are visible,
      # rather than only in the payload where it can only report the damage.
      - name: Every shipped hook is registered, and every registration exists
        run: |
          fail=0
          jq -r '[.hooks[][].hooks[].command]
                 | map(capture("run-payload-hook (?<n>[a-z0-9-]+\\.sh)").n)
                 | .[]' plugin/hooks/hooks.json | sort -u > /tmp/registered
          # Read loops rather than `for n in $var`: a bare expansion depends on
          # IFS containing a newline, which is true in bash and not everywhere.
          while IFS= read -r n; do
            [ -n "$n" ] || continue
            [ -f "plugin/payload/bin/hooks/riprap/claude/$n" ] || {
              echo "❌ hooks.json registers $n, which the payload does not ship"; fail=1; }
          done < /tmp/registered
          for f in plugin/payload/bin/hooks/riprap/claude/*.sh; do
            n=$(basename "$f")
            # lint-example.sh is an inert template. Wiring a rule that never
            # fires teaches people to ignore the wiring.
            [ "$n" = "lint-example.sh" ] && continue
            grep -qx "$n" /tmp/registered || {
              echo "❌ $f exists but hooks.json does not register it"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "✅ hook registration matches the payload"
          exit "$fail"

      - name: Skills are namespaced and self-describing
        run: |
          fail=0
          for d in plugin/skills/*/; do
            n=$(basename "$d")
            grep -q "^name: $n$" "$d/SKILL.md" || {
              echo "❌ $d/SKILL.md name: does not match its directory"; fail=1; }
            # The harness prefixes the plugin name; the description has to agree,
            # or a project with its own /$n leaves the model choosing between two.
            #
            # A leading path component is not an invocation. `bin/release` and
            # `script/release` are what a release skill has to tell you to look for,
            # and the first version of this check read them as bare invocations —
            # a guardrail firing on the legitimate case, which is how guardrails get
            # deleted. So the character before the slash must be one that could not
            # be part of a path: not a colon (that is /riprap:$n), and not alphanumeric,
            # dot, dash, underscore or another slash. A bare " /$n" or "`/$n`" still fails.
            if grep -qE "(^|[^:[:alnum:]_./-])/$n\b" "$d/SKILL.md"; then
              echo "❌ $d/SKILL.md refers to /$n; it is invoked as /riprap:$n"; fail=1
            fi
            # No skill carries a settings block. plugin/skills/ is replaced wholesale
            # on update, so a value an adopter edits into one is reverted the next time
            # the plugin moves — and the skill goes on behaving as though it were still
            # set. Skills ask once and store the answer in the project instead.
            # Every markdown file in the directory, not just SKILL.md. A skill is allowed
            # reference files beside it, they ship from the same replaced-on-update cache,
            # and CLAUDE.md states the rule as "under plugin/skills/" — so a check that
            # read one filename was narrower than the rule it enforces.
            while IFS= read -r m; do
              if grep -qiE '^#+[[:space:]]+(configuration|config|settings)\b' "$m"; then
                echo "❌ $m has a settings block; ask once and store it in the project"; fail=1
              fi
            done < <(find "$d" -name '*.md')
          done
          [ "$fail" -eq 0 ] && echo "✅ skills namespaced"
          exit "$fail"

      # The naming check above proves CLAUDE.md mentions every skill. It cannot prove
      # CLAUDE.md has stopped writing their procedures out beside them, and nothing can
      # — no check reads prose for meaning. What a check can see is the shape the fork
      # takes when it grows back: raw git plumbing in a contributor doc, for an act that
      # bin/release or a skill already owns. CLAUDE.md carried exactly that until the
      # release section was pruned back to the facts only riprap knows.
      - name: CLAUDE.md does not re-inline what a skill or bin/release owns
        run: |
          fail=0
          # `git tag `      — bin/release tags, and refuses unless HEAD is on the default
          #                   branch. A tag typed by hand skips that and cannot be undone.
          # `gh release create` — the release workflow publishes on tag push. A second
          #                   publisher collides with it and reads as a tooling bug.
          # `git branch -D` — branch-cleaner's job, and it confirms before deleting.
          for pat in 'git tag ' 'gh release create' 'git branch -D'; do
            if grep -qF -- "$pat" CLAUDE.md; then
              echo "❌ CLAUDE.md contains '$pat' — that act belongs to bin/release or a skill."
              grep -nF -- "$pat" CLAUDE.md
              fail=1
            fi
          done
          # `git push origin v` is deliberately NOT in that list, and this note is here so
          # nobody adds it as an oversight. bin/release refuses to push on purpose — a tag
          # push publishes something that cannot be un-published, so it should be a thing a
          # person types. release.yml only runs after the push, and the release skill's own
          # tagging block is disabled for projects with a release script. It is the single
          # step nothing else will ever perform, so CLAUDE.md is the right place to show it.
          [ "$fail" -eq 0 ] && echo "✅ CLAUDE.md routes rather than re-inlines"
          exit "$fail"

      # riprap stores its own answers to its own skills, which is what stops them
      # re-interviewing this repository every run. Both skills that read those
      # answers say the same thing about them: re-ask when one stops resolving,
      # because a stale stored answer is the single thing storing answers could
      # make worse. That rule is addressed to a model mid-run, which is the worst
      # place to first discover that a path moved. This checks it at merge instead.
      - name: riprap's answers to its own skills still resolve
        env:
          # The repository's real default branch, from the event payload. It has to
          # come from here: actions/checkout leaves a detached HEAD with no branch
          # refs at all, so asking git whether refs/heads/main exists answers "no" on
          # every PR. The first version of this check did exactly that and failed the
          # build on a correct answers file — the same guardrail-fires-on-the-
          # legitimate-case shape the skill-invocation check above had to be narrowed
          # for. release.yml already reads the default branch this way.
          REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          fail=0
          A=.claude/instructions/riprap-skills.md
          [ -f "$A" ] || { echo "❌ $A is missing; every skill will re-interview the repo"; exit 1; }

          # A section per skill that carries the stored-answers protocol. Detected by
          # the protocol itself rather than a hardcoded list, so a skill that grows one
          # is caught the day it ships rather than the day it asks.
          for d in plugin/skills/*/; do
            n=$(basename "$d")
            grep -q 'riprap-skills\.md' "$d/SKILL.md" || continue
            grep -q "^## riprap:$n\$" "$A" || {
              echo "❌ $A has no '## riprap:$n' section, but that skill reads one"; fail=1; }
          done

          # Every path named as a version file exists. This is the answer whose rot is
          # worst: the release skill writes the version into whatever it is told, and a
          # path that moved means a release that ships the old number everywhere.
          while IFS= read -r p; do
            [ -e "$p" ] || { echo "❌ $A names version file $p, which does not exist"; fail=1; }
          done < <(sed -n 's/^- Version files: //p' "$A" | tr ',' '\n' | tr -d ' `')

          # The recorded release branch is the repository's actual default. A renamed
          # branch is how a release gets cut from somewhere nobody is watching.
          D=$(sed -n 's/^- Release branch: //p' "$A" | tr -d ' `')
          [ -n "$D" ] || { echo "❌ $A records no release branch"; fail=1; }
          # Authoritative in CI; outside it, fall back to the remote's own HEAD.
          ACTUAL="${REPO_DEFAULT_BRANCH:-}"
          [ -n "$ACTUAL" ] || ACTUAL=$(git symbolic-ref --quiet --short \
            refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||' || true)
          if [ -n "$D" ] && [ -n "$ACTUAL" ] && [ "$D" != "$ACTUAL" ]; then
            echo "❌ $A records release branch '$D', but the default is '$ACTUAL'"; fail=1
          elif [ -n "$D" ] && [ -z "$ACTUAL" ]; then
            # Never let an unanswerable question read as a pass. Same rule the release
            # skill states for the forge: "could not check" is not "checked and fine".
            echo "ℹ️  could not determine the default branch; '$D' went unverified"
          fi

          # And the answer that is load-bearing for riprap specifically: the bump and
          # the tag go through bin/release, which enforces three things nothing else
          # does. Hand-tagging around it publishes a tag that cannot be withdrawn and
          # burns the version number for good.
          grep -q '^- Bump and tag: .*bin/release' "$A" || {
            echo "❌ $A no longer records bin/release as what performs the bump and tag"; fail=1; }
          [ -x bin/release ] || { echo "❌ bin/release is not executable"; fail=1; }

          [ "$fail" -eq 0 ] && echo "✅ riprap's stored answers resolve"
          exit "$fail"

      # The plugin must be harmless in a repository that never ran the install.
      # Every guardrail hook goes through the dispatcher for exactly this reason.
      - name: Plugin is inert without the payload
        run: |
          mkdir -p /tmp/bare && cd /tmp/bare && git init -q
          cd "$GITHUB_WORKSPACE"
          fail=0
          for n in block-destructive-outside-cwd.sh block-unreviewed-merge.sh \
                   lint-secrets.sh format-on-write.sh session-end.sh \
                   lint-tech-footprint.sh; do
            out=$(echo '{}' | CLAUDE_PROJECT_DIR=/tmp/bare \
                  plugin/hooks/run-payload-hook "$n" 2>&1) || {
              echo "❌ $n exited non-zero with no payload"; fail=1; continue; }
            [ -z "$out" ] || { echo "❌ $n printed output with no payload: $out"; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "✅ inert without the payload"
          exit "$fail"

      - name: SessionStart emits valid JSON
        run: |
          CLAUDE_PLUGIN_ROOT="$PWD/plugin" plugin/hooks/session-start \
            | jq -e '.hookSpecificOutput.additionalContext | length > 500' > /dev/null

  # Proves the thing riprap actually promises: that installing it works.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install into a fresh repo and verify
        run: |
          mkdir -p /tmp/target && cd /tmp/target
          git init -q && git config user.email ci@example.com && git config user.name CI
          echo "# target" > README.md && git add -A && git commit -qm init
          cd "$GITHUB_WORKSPACE"
          plugin/scripts/install-payload /tmp/target
          cd /tmp/target
          bin/riprap wire
          test "$(git config core.hooksPath)" = "bin/hooks/git"
          bin/riprap verify
          for t in bin/hooks/riprap/tests/test-*.sh; do bash "$t"; done
          # A fresh install must be committable — its own fixtures must not trip
          # the secret hook, and the delegating seed hook must actually fire.
          # Without that grep a broken delegation looks exactly like a clean commit.
          git add -A
          git commit -qm "install riprap" 2>&1 | tee /tmp/commit.log
          grep -q "secret hygiene passed" /tmp/commit.log \
            || { echo "❌ the seed pre-commit did not reach riprap's checks"; exit 1; }
          # Assert the tech-footprint check reported at all. It reports on every
          # branch precisely so "ran and found nothing" cannot be confused with
          # "did not run" — the confusion that let an earlier version fail open.
          grep -q "tech footprint" /tmp/commit.log \
            || { echo "❌ the tech-footprint check did not run on install"; exit 1; }

      # Asserting the check RAN is not the same as asserting it WORKS. Every path
      # in the install commit is allow-listed, so that grep alone would still pass
      # against a scanner that classified nothing. This drives the rejection.
      - name: The installed tech-footprint hook actually blocks
        run: |
          cd /tmp/target
          # Give the repo an established stack, so the rule has a baseline.
          printf 'package main\n' > main.go
          printf 'module target\n' > go.mod
          git add -A && git commit -qm "go baseline"
          printf 'print(1)\n' > tool.py && git add tool.py
          if git commit -qm "should be rejected" 2>/tmp/reject.log; then
            echo "❌ a .py committed cleanly into a Go repo — the hook is not enforcing"
            exit 1
          fi
          grep -q "add a technology this repository does not use" /tmp/reject.log \
            || { echo "❌ rejected, but not by the tech-footprint rule:"; cat /tmp/reject.log; exit 1; }
          # And the escape hatch releases it, so the rule is not a wall.
          printf '# lint-ok:tech-footprint\nprint(1)\n' > tool.py && git add tool.py
          git commit -qm "hatched" \
            || { echo "❌ lint-ok:tech-footprint did not release the file"; exit 1; }
          echo "✅ the installed hook blocks, names the rule, and honours its hatch"

      - name: Re-running the install is the update path, and changes nothing
        run: |
          cd "$GITHUB_WORKSPACE"
          plugin/scripts/install-payload /tmp/target
          cd /tmp/target
          test -z "$(git status --porcelain)" \
            || { echo "❌ re-running the install dirtied the tree:"; git status --short; exit 1; }
          echo "✅ install is idempotent"

      # "Additive" has to be demonstrable, not asserted. Unwiring must put the
      # repo back exactly as it was, and must not unset config riprap never set.
      - name: Wiring is reversible
        run: |
          cd /tmp/target
          bin/riprap wire --uninstall
          test -z "$(git config --get core.hooksPath || true)" \
            || { echo "❌ core.hooksPath survived the uninstall"; exit 1; }
          test -z "$(git config --get riprap.hooksPath.owned || true)" \
            || { echo "❌ the ownership marker survived the uninstall"; exit 1; }
          bin/riprap wire   # put it back for the steps that follow
          echo "✅ uninstall reverses wire"

      - name: Uninstall leaves another tool's hooks config alone
        run: |
          mkdir -p /tmp/incumbent/.githooks && cd /tmp/incumbent
          git init -q && git config user.email ci@example.com && git config user.name CI
          printf '#!/usr/bin/env bash\necho INCUMBENT_RAN\n' > .githooks/pre-commit
          chmod +x .githooks/pre-commit
          git config core.hooksPath .githooks
          echo "# t" > README.md && git add -A && git commit -qm init
          cd "$GITHUB_WORKSPACE"
          plugin/scripts/install-payload /tmp/incumbent > /dev/null
          cd /tmp/incumbent
          # wire must refuse rather than steal the setting, so it exits non-zero
          bin/riprap wire && { echo "❌ wire claimed an occupied core.hooksPath"; exit 1; }
          test "$(git config --get core.hooksPath)" = ".githooks" \
            || { echo "❌ wire changed core.hooksPath anyway"; exit 1; }
          bin/riprap wire --uninstall
          test "$(git config --get core.hooksPath)" = ".githooks" \
            || { echo "❌ uninstall unset config riprap never set"; exit 1; }
          echo "✅ the incumbent's hooks config is untouched throughout"

      - name: A retired guardrail is pruned, not left running
        run: |
          cd /tmp/target
          echo "stale" > bin/hooks/riprap/lib/retired-patterns.sh
          git add -A && git commit -qm stale
          cd "$GITHUB_WORKSPACE"
          plugin/scripts/install-payload /tmp/target > /dev/null
          test ! -f /tmp/target/bin/hooks/riprap/lib/retired-patterns.sh \
            || { echo "❌ a file upstream no longer ships was left in place"; exit 1; }
          test -f /tmp/target/bin/hooks/riprap/VERSION \
            || { echo "❌ the version stamp was pruned"; exit 1; }
          echo "✅ pruned, and the version stamp survived"
