# The write skill's reference material is extracted from a living document. Taken
# once and never refreshed it drifts silently — still answering questions with
# guidance the source has since changed, and nothing looks broken.
#
# So the refresh runs here rather than in the main build. Wiring an external site
# into CI means a Google outage or a page redesign turns somebody's unrelated pull
# request red, which is how a check gets deleted. This job owns the network call;
# `bin/refresh-style-guide --check` in CI stays offline and only asserts that what
# is committed is complete and attributed.
#
# It opens a pull request rather than pushing. The diff is upstream's words
# changing, which is a change to the standard riprap ships to every adopter — that
# deserves a person reading it, not a bot commit nobody sees.
name: Refresh style guide

on:
  schedule:
    # Mondays, early UTC. Weekly is the right cadence for a style guide: often
    # enough that a diff stays small enough to actually read, rare enough that the
    # pull request is not noise.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-fetch the style guide
        run: bin/refresh-style-guide

      - name: Validate what was generated
        run: bin/refresh-style-guide --check

      # scrub-check gates everything published, and the generated reference is
      # exempt by path — but the exemption is in bin/scrub-check, so running the
      # whole scan here catches the case where somebody narrowed it.
      - name: Scrub
        run: bin/scrub-check plugin/ docs/ README.md

      - name: Open a pull request if upstream moved
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-style-guide
          # One rolling branch: a second run before the first is merged updates
          # that pull request rather than opening a competing one.
          title: 'Refresh the style guide reference from upstream'
          commit-message: 'Refresh the style guide reference from upstream'
          add-paths: plugin/skills/write/reference
          delete-branch: true
          body: |
            `bin/refresh-style-guide` re-fetched the Google developer documentation
            style guide and the extraction changed.

            **This diff is upstream's words, not riprap's.** Read it as a change to
            the standard riprap ships to every adopter, not as a formatting nit.
            Three things are worth checking before merging:

            - Does anything here now contradict
              `plugin/instructions/writing-style.md`? That file is riprap's own
              distillation and is not regenerated, so upstream can drift away from
              it. If it has, update it in this pull request.
            - Did a page disappear? `--check` fails on a missing section, so a green
              run means every page the generator claims to cover is present.
            - Did the licence attribution survive? `--check` asserts that too.

            Generated by `.github/workflows/refresh-style-guide.yml`.
