<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="riprap">
  <!-- Riprap is loose stone armouring: courses of rough blocks laid so the layer below
       cannot be undercut. An .ico is a binary file and bin/scrub-check refuses to publish
       any file that is not text, so this mark is drawn rather than exported. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <g fill="#fff">
    <rect x="5" y="6" width="9.5" height="5.5" rx="1.6"/>
    <rect x="17.5" y="6" width="9.5" height="5.5" rx="1.6"/>
    <rect x="11.25" y="13.25" width="9.5" height="5.5" rx="1.6"/>
    <rect x="5" y="20.5" width="9.5" height="5.5" rx="1.6"/>
    <rect x="17.5" y="20.5" width="9.5" height="5.5" rx="1.6"/>
  </g>
</svg>
